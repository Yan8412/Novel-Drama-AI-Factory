name: Candidate offline Windows-macOS regression (manual only)

# IMPORTANT: GitHub-hosted minutes/storage may incur charges. No automatic triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Read-only checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline unit tests (no pip install, no provider credentials)
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Reviewed file boundary
        shell: bash
        run: python -B tools/guard_staging.py .
